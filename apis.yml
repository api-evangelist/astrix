aid: astrix
name: Astrix
description: >-
  Astrix Security is a non-human identity (NHI) and AI agent security platform. It
  gives enterprises a real-time inventory of every AI agent, MCP server, service
  account, OAuth app, API key, SSH key and IAM role across their environment, then
  detects excessive privileges, misconfigurations, anomalous activity and policy
  violations and drives automated remediation. Its Agent Control Plane provisions
  secure-by-design AI agents with short-lived, precisely scoped credentials. Astrix
  became part of Cisco in 2026 and ended standalone sales of new licenses effective
  June 30, 2026. Originally surfaced as a portfolio company of Bessemer Venture
  Partners and Menlo Ventures. Sector: cybersecurity. This is a company profile —
  Astrix publishes no public developer API, so the profile carries identity,
  security-posture, and compliance signals rather than API specifications.
